# Alembic 마이그레이션 설정

[alembic]
sqlalchemy.url = driver://user:pass@localhost/dbname

script_location = alembic
prepend_sys_path = .
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.url_queue_size = 10
sqlalchemy.url_max_overflow = 20

[loggers]
keys = sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

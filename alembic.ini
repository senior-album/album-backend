# Alembic config. URL is overridden at runtime in alembic/env.py
# from app.core.config.Settings.database_url - do NOT put secrets here.

[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder - replaced by env.py. Kept for offline-mode SQL generation only.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/placeholder
# Version file naming: NNN_description.py
file_template = %%(rev)s_%%(slug)s
# Timezone for migration file timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

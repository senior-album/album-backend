name: pip-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # 도입 초기 soft-fail — findings 는 로그로 확인하고 점진 수정.
    # 클린 상태 도달 후 이 줄 제거로 strict 전환.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --strict --format columns

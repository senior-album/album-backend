name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Strict 모드 — .gitleaksignore 로 test fixture 허용 정리 완료. 신규 leak
      # 발견 시 CI 실패. 새로운 false positive 면 .gitleaksignore 에 fingerprint
      # 추가 (docs/SECRETS.md 참조).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: PR Check

# 모델 변경이 들어왔는데 해당 migration 이 함께 커밋되지 않으면 막는다.
# `alembic check` 는 target_metadata (모델) 와 현재 DB 상태를 비교해 diff 가
# 있으면 non-zero exit — migration 파일을 빠뜨린 PR 을 CI 에서 차단.

on:
  pull_request:
    branches: [main]

jobs:
  alembic-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      # env.py 는 Settings 를 거쳐 URL 을 만드므로 POSTGRES_* 로 주입.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      # Settings 가 필수로 요구하는 env — CI 전용 더미 값
      JWT_SECRET: ci-dummy-secret
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret
      # T-003 envelope encryption — base64(32 zero bytes). 운영 키 아님.
      RESIDENT_PII_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RESIDENT_NAME_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: alembic upgrade head (빈 DB 에 전체 마이그레이션 적용)
        run: alembic upgrade head

      - name: alembic check (모델-마이그레이션 동기화 검증)
        # `alembic check` 는 target_metadata 와 현재 DB 를 비교해 diff 가 없어야
        # pass. 모델을 바꾸고 revision 을 안 만든 PR 은 여기서 실패한다.
        run: alembic check

  # T-124: 단위 테스트가 PR 머지 게이트로 동작하도록. 인메모리 SQLite 만 쓰기에
  # postgres service 는 불필요.
  pytest:
    runs-on: ubuntu-latest

    env:
      # Settings 가 필수로 요구하는 env — CI 전용 더미 값
      JWT_SECRET: ci-dummy-secret
      JWT_REFRESH_SECRET: ci-dummy-refresh-secret
      RESIDENT_PII_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RESIDENT_NAME_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libmagic
        # python-magic 은 libmagic 시스템 라이브러리 필요. python-magic-bin 은
        # Windows 전용이라 Linux 에선 별도 설치 (requirements 의 sys_platform
        # 마커 참고).
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov==7.1.0

      - name: Run pytest with coverage
        # T-124 핵심 영역 — JWT (security), 업로드 플로우 (storage / upload_photos),
        # face_recognition, 그리고 인증 endpoint 본 흐름 (auth) — 만 --cov 로 강조.
        # 나머지 모듈은 여전히 측정되지만 term 리포트의 시그널을 분명히 한다.
        #
        # `app.api.photos` 의 비-업로드 endpoint (list / get / delete / share /
        # like / bulk-publish 등) 는 의도적으로 게이트 밖. T-124 정의는 "업로드
        # 플로우" 까지로 한정되며 (sanitize · validate · rate limit · multipart
        # upload 통합으로 커버 완료), 일반 CRUD endpoint 회귀 방지는 향후 별도
        # 영역으로 다룬다. 새 게이트가 필요하면 그 때 신규 티켓으로.
        run: |
          pytest tests/ \
            --cov=app.core.security \
            --cov=app.core.storage \
            --cov=app.services.face_recognition \
            --cov=app.services.opensearch_service \
            --cov=app.services.photo_worker \
            --cov=app.api.auth \
            --cov-report=term \
            --cov-fail-under=70 \
            -v
